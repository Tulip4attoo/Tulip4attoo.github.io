<header class="header">

  <div class="site-title">
    {% if page.title %}
    <h1 class="entry-title{% if page.layout == 'post' %} post-title{% endif %}"><a href="{{ page.url }}">{{ page.title }}</a></h1>
    {% if page.layout == 'post' and page.date %}
    <time class="header-post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    {% endif %}
    {% else%}
    <img src="{{ '/assets/img/site-logo.png' | relative_url }}" style="width: 42px;" />
    <a href="/">{{ site.title }}</a>
    {% endif %}
  </div>

  <button id="theme-toggle" title="Toggle theme">
    <span class="icon-sun">☀️</span>
    <span class="icon-moon">🌙</span>
  </button>

<div class="links">
    {% assign current = page.title %}
    <a href="/" class="page-link{% if current == 'Home' %} active{% endif %}">Home</a>
    <a href="/blog/" class="page-link{% if current == 'Blog' or page.layout == 'post' %} active{% endif %}">Blog</a>
    <a href="/now/" class="page-link{% if current == 'Now' %} active{% endif %}">Now</a>
    <a href="/about/" class="page-link{% if current == 'About' %} active{% endif %}">About</a>
</div>
</header>
